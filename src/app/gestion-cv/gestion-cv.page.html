<ion-header>
  <ion-toolbar color="primary">
    <ion-title>📝 Gestión de Hoja de Vida (PDF)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="background: #f4f4f4; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #3880ff;">
    <h2 style="margin-top: 0;">Configuración del Reporte</h2>
    <p>Los datos que ingreses aquí alimentarán exclusivamente la tabla <strong>hoja_de_vida_pro</strong> para generar tu PDF.</p>
  </div>

  <ion-item>
    <ion-label position="stacked">Resumen Profesional para el PDF</ion-label>
    <ion-textarea placeholder="Escribe aquí el extracto que aparecerá en tu reporte..." rows="6"></ion-textarea>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Experiencia Clave</ion-label>
    <ion-textarea placeholder="Detalla tu experiencia principal..."></ion-textarea>
  </ion-item>

  <ion-button expand="block" color="success" style="margin-top: 20px;">
    💾 Guardar Datos y Actualizar Reporte
  </ion-button>

  <ion-button expand="block" color="danger" fill="outline">
    🖨️ Generar Vista Previa PDF
  </ion-button>
</ion-content>
