<ion-card style="padding: 15px;">
  <ion-list>
    <ion-item>
      <ion-label position="floating">Título PDF (Nombre y Apellido)</ion-label>
      <ion-input [(ngModel)]="perfilData.nombres_apellidos"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Mi Trayectoria (Contenido Detalle)</ion-label>
      <ion-textarea [(ngModel)]="perfilData.trayectoria" rows="4"></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Formación Académica</ion-label>
      <ion-textarea [(ngModel)]="perfilData.formacion" rows="2"></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Experiencia Laboral</ion-label>
      <ion-textarea [(ngModel)]="perfilData.experiencia_laboral" rows="2"></ion-textarea>
    </ion-item>
  </ion-list>

  <div style="display: flex; gap: 10px; margin-top: 20px;">
    <ion-button (click)="sincronizar()" color="warning" style="flex: 1;">
      SINCRONIZAR
    </ion-button>
    <ion-button (click)="imprimirPDF()" color="tertiary" style="flex: 1;">
      IMPRIMIR PDF
    </ion-button>
  </div>
</ion-card>
