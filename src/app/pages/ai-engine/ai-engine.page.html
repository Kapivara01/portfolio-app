<!-- HEADER OFICIAL CON LOGOS AMPLIADOS Y SIMÉTRICOS -->
<ion-header class="ion-no-border">
  <ion-toolbar color="light" style="padding: 5px 15px; --min-height: 85px;">
    <ion-buttons slot="start">
      <img src="assets/images/civ-logo.png" alt="Colegio de Ingenieros" style="height: 75px; width: 75px; object-fit: contain;" onerror="this.style.display='none'">
    </ion-buttons>

    <ion-title class="ion-text-center" style="font-size: 0.95rem; font-weight: 600;">
      <span style="margin: 0 8px; cursor: pointer; color: #666;" routerLink="/home">inicio</span> |
      <span style="margin: 0 8px; cursor: pointer; color: #666;" routerLink="/profile">perfil profesional</span> |
      <span style="margin: 0 8px; cursor: pointer; color: #666;" routerLink="/portfolio">portafolio</span>
    </ion-title>

    <ion-buttons slot="end">
      <img src="assets/images/uneti-logo.jpg" alt="UNETI" style="height: 75px; width: 75px; object-fit: contain;" onerror="this.style.display='none'">
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- CONTENIDO PRINCIPAL CON SCROLL LIBRE -->
<ion-content [fullscreen]="true" style="--background: #f8fafc;">
  
  <div style="display: flex; flex-direction: column; min-height: 100%;">
    
    <!-- IFRAME CON ALTURA FIJA PARA PERMITIR SCROLL -->
    <div style="width: 100%; height: 750px; flex-shrink: 0;">
      <iframe src="https://jorge-linares-ia-uneti.netlify.app" style="width: 100%; height: 100%; border: none;" title="Motor IA"></iframe>
    </div>

    <!-- FOOTER PROFESIONAL AL FINAL DEL FLUJO -->
    <div style="background-color: #0f172a; border-top: 3px solid var(--ion-color-primary); padding: 25px 15px; text-align: center; width: 100%; margin-top: auto;">
      <p style="font-size: 0.9rem; color: #ffffff; margin: 0 0 4px 0; font-weight: 600; letter-spacing: 0.5px;">
        Ing. Jorge Luis Linares
      </p>
      <p style="font-size: 0.8rem; color: #94a3b8; margin: 0;">
        &copy; 2026 - Portafolio Profesional Conectado a MongoDB
      </p>
    </div>

  </div>

</ion-content>
