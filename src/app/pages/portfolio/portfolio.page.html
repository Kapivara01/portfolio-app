<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Portafolio</ion-title>
  </ion-toolbar>

  <ion-toolbar color="primary">
    <ion-segment [(ngModel)]="categoriaActiva">
      <ion-segment-button value="Todas">
        <ion-label>Todas</ion-label>
      </ion-segment-button>
      <ion-segment-button value="Telecomunicaciones">
        <ion-label>Telecom</ion-label>
      </ion-segment-button>
      <ion-segment-button value="Informática">
        <ion-label>Informática</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div *ngIf="proyectos.length === 0" class="ion-text-center ion-padding-top">
    <ion-icon name="cloud-offline-outline" style="font-size: 64px;" color="medium"></ion-icon>
    <p>No se encontraron proyectos en la base de datos.</p>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let p of proyectos">
        <ion-card *ngIf="categoriaActiva === 'Todas' || p.category === categoriaActiva">
          
          <img [src]="p.image_url || 'https://via.placeholder.com/800x400?text=Ingeniería+Nattier'" alt="Proyecto" />
          
          <ion-card-header>
            <ion-card-subtitle color="tertiary">{{ p.category }}</ion-card-subtitle>
            <ion-card-title>{{ p.title }}</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <p>{{ p.description }}</p>
            <ion-button fill="clear" class="ion-no-padding ion-margin-top">
              DETALLES <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
