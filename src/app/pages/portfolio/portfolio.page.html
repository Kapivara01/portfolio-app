<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Ing. Jorge Luis Linares</ion-title>
  </ion-toolbar>

  <ion-toolbar color="primary">
    <ion-segment [(ngModel)]="categoriaActiva">
      <ion-segment-button value="Todas">
        <ion-label>TODAS</ion-label>
      </ion-segment-button>
      <ion-segment-button value="Telecomunicaciones">
        <ion-label>TELECOM</ion-label>
      </ion-segment-button>
      <ion-segment-button value="Informática">
        <ion-label>INFORMÁTICA</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div *ngIf="proyectos.length === 0" class="ion-text-center ion-padding-top">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando proyectos...</p>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let p of proyectos">
        
        <ion-card *ngIf="categoriaActiva === 'Todas' || (p.category && p.category.toLowerCase() === categoriaActiva.toLowerCase())">
          
          <img [src]="p.image_url || 'https://via.placeholder.com/800x400?text=Ingeniería'" alt="Proyecto" />
          
          <ion-card-header>
            <ion-card-subtitle color="tertiary">{{ p.category }}</ion-card-subtitle>
            <ion-card-title>{{ p.title }}</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <p>{{ p.description }}</p>
            <ion-button fill="clear" class="ion-no-padding ion-margin-top">
              DETALLES <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
            </ion-button>
          </ion-card-content>
        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
