<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Hoja de Vida Profesional</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="!cargando">
    <h2 class="ion-text-center" style="color: #002d5b; font-weight: bold; margin-bottom: 20px;">PERFIL PROFESIONAL</h2>
    <ion-list lines="full">
      <ion-item lines="none">
        <ion-avatar slot="start" style="width: 80px; height: 80px; border: 2px solid #002d5b;">
          <img [src]="perfilForm.foto_url || 'assets/icon/favicon.png'">
        </ion-avatar>
        <ion-label><h3 style="color: #002d5b; font-weight: bold;">FOTO ACTUAL</h3></ion-label>
      </ion-item>
      <ion-item><ion-label position="stacked">NOMBRES</ion-label><ion-input [(ngModel)]="perfilForm.nombres_apellidos" readonly></ion-input></ion-item>
      <ion-item><ion-label position="stacked">TÍTULO</ion-label><ion-input [(ngModel)]="perfilForm.subtitulos" readonly></ion-input></ion-item>
      <ion-item><ion-label position="stacked">EXTRACTO</ion-label><ion-textarea [(ngModel)]="perfilForm.subtitulos" readonly auto-grow></ion-textarea></ion-item>
      <ion-item><ion-label position="stacked">TRAYECTORIA</ion-label><ion-textarea [(ngModel)]="perfilForm.trayectoria" readonly auto-grow></ion-textarea></ion-item>
      <ion-item><ion-label position="stacked">FORMACIÓN</ion-label><ion-textarea [(ngModel)]="perfilForm.formacion" readonly auto-grow></ion-textarea></ion-item>
      <div style="margin: 15px 16px 5px; color: #002d5b; font-weight: bold; font-size: 1.1rem;">CURSOS / SEMINARIOS / DIPLOMADOS</div>
      <div style="display: block; height: 130px; overflow-y: scroll !important; -webkit-overflow-scrolling: touch; padding: 12px; background: #f4f4f4; border: 1px solid #ccc; border-radius: 8px; margin: 0 16px 20px; color: #333; font-size: 1rem; white-space: pre-wrap;">
        {{ perfilForm.cursos }}
      </div>

      <ion-item><ion-label position="stacked">TELÉFONO</ion-label><ion-input [(ngModel)]="perfilForm.telefono" readonly></ion-input></ion-item>
      <ion-item><ion-label position="stacked">UBICACIÓN</ion-label><ion-input [(ngModel)]="perfilForm.direccion" readonly></ion-input></ion-item>
      <ion-item><ion-label position="stacked">CORREO</ion-label><ion-input [(ngModel)]="perfilForm.correo" readonly></ion-input></ion-item>
      <ion-item style="margin-bottom: 20px;"><ion-label position="stacked">LINKEDIN</ion-label><ion-input [(ngModel)]="perfilForm.linkedin" readonly></ion-input></ion-item>
    </ion-list>
    <ion-button expand="block" (click)="guardarCambios()" style="margin: 20px 16px 50px; --background: #002d5b; font-weight: bold; height: 50px;">
      SINCRONIZAR DATOS
    </ion-button>
  </div>
</ion-content>
