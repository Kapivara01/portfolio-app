<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Mi Perfil Profesional</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="cargando" class="ion-text-center">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="!cargando" class="hoja-vida-container">
    <h2 class="ion-text-center" style="color: #002d5b; font-weight: bold; margin-bottom: 25px;">
      HOJA DE VIDA
    </h2>
    
    <ion-list lines="full">
      <ion-item lines="none" style="margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 20px; width: 100%;">
          <ion-avatar style="width: 90px; height: 90px; border: 3px solid #002d5b; flex-shrink: 0;">
            <img [src]="perfilForm.foto_url || 'assets/icon/favicon.png'" 
                 (error)="perfilForm.foto_url = 'assets/icon/favicon.png'">
          </ion-avatar>
          <div style="flex-grow: 1;">
            <h3 style="margin: 0; color: #002d5b; font-weight: bold;">FOTO ACTUAL</h3>
            <p style="margin: 0; font-size: 0.8rem; color: #666;">Imagen del perfil profesional</p>
          </div>
        </div>
      </ion-item>

      <ion-item>
        <ion-label position="stacked" style="color: #002d5b; font-weight: bold; font-size: 1.1rem;">NOMBRES Y APELLIDOS</ion-label>
        <ion-input [(ngModel)]="perfilForm.nombres_apellidos"></ion-input>
      </ion-item>
      
      <ion-item>
        <ion-label position="stacked" style="color: #002d5b; font-weight: bold; font-size: 1.1rem;">ESPECIALIDAD / TÍTULO</ion-label>
        <ion-input [(ngModel)]="perfilForm.subtitulos" placeholder="Ej: Ing. Telecomunicaciones"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked" style="color: #002d5b; font-weight: bold; font-size: 1.1rem;">EXTRACTO PROFESIONAL</ion-label>
        <ion-textarea [(ngModel)]="perfilForm.subtitulos" placeholder="Breve resumen de tu perfil profesional"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label position="stacked" style="color: #002d5b; font-weight: bold; font-size: 1.1rem;">TRAYECTORIA LABORAL</ion-label>
        <ion-textarea [(ngModel)]="perfilForm.trayectoria" rows="3"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label position="stacked" style="color: #002d5b; font-weight: bold; font-size: 1.1rem;">FORMACIÓN ACADÉMICA</ion-label>
        <ion-textarea [(ngModel)]="perfilForm.formacion" rows="3"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label position="stacked" style="color: #002d5b; font-weight: bold; font-size: 1.1rem;">TELÉFONO DE CONTACTO</ion-label>
        <ion-input [(ngModel)]="perfilForm.telefono" type="tel"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked" style="color: #002d5b; font-weight: bold; font-size: 1.1rem;">UBICACIÓN / DIRECCIÓN</ion-label>
        <ion-input [(ngModel)]="perfilForm.direccion"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked" style="color: #002d5b; font-weight: bold; font-size: 1.1rem;">CORREO ELECTRÓNICO</ion-label>
        <ion-input [(ngModel)]="perfilForm.correo" type="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked" style="color: #002d5b; font-weight: bold; font-size: 1.1rem;">LINKEDIN (ENLACE)</ion-label>
        <ion-input [(ngModel)]="perfilForm.linkedin"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" (click)="guardarCambios()" style="margin-top: 25px; font-weight: bold; --background: #002d5b;">
      <ion-icon name="sync-circle-outline" slot="start"></ion-icon>
      Sincronizar Datos Profesionales
    </ion-button>
  </div>
</ion-content>>
