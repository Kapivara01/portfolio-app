<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>MOTOR DE PDF - DINÁMICO</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="header-reporte" style="background: #1e3a8a; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px;">
    <h1 style="margin: 0; font-size: 1.5rem;">{{ perfil.nombres_apellidos }}</h1>
    <p style="margin: 5px 0 0;">{{ perfil.subtitulos }}</p>
  </div>

  <ion-card mode="ios">
    <ion-card-header>
      <ion-card-title>Vista Previa de Datos</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item lines="none">
        <ion-label><strong>Correo:</strong> {{ perfil.correo }}</ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-label><strong>Ubicación:</strong> {{ perfil.direccion }}</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" color="danger" (click)="generarPDF()" style="height: 55px; font-weight: bold; margin-top: 25px;">
    <ion-icon name="document-text" slot="start"></ion-icon>
    GENERAR Y DESCARGAR PDF ACTUALIZADO
  </ion-button>
</ion-content>
