<ion-content [fullscreen]="true">
  <div id="container" style="text-align: center; margin-top: 3.5rem; padding: 0 20px;">
    
    <div class="profile-avatar-wrapper"
         style="width: 220px; height: 220px; border-radius: 50%; margin: 0 auto 1.5rem; border: 5px solid var(--ion-color-primary); box-shadow: 0 12px 28px rgba(56, 128, 255, 0.25); overflow: hidden;">
      <img src="assets/images/profile.jpg" alt="Jorge Luis Linares" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    
    <h1 style="color: var(--ion-color-primary); font-weight: 800; font-size: 2.3rem; margin-bottom: 5px; text-transform: uppercase;">
      Ing. Jorge Luis Linares
    </h1>
    <p style="font-size: 1.1rem; color: #666; margin-top: 0; font-weight: 600; letter-spacing: 1.5px;">
      TELECOMUNICACIONES E INFORMÁTICA
    </p>
    
    <div style="border-top: 1px solid #ddd; padding-top: 25px; width: 85%; max-width: 700px; margin: 25px auto;">
      <p style="font-size: 1.35rem; color: #333; line-height: 1.5; font-weight: 500; text-align: center; margin: 0;">
        Ingeniero con talento excepcional para el desarrollo moderno y la gestión técnica. Mi fortaleza reside en la gestión técnica y humana, aplicando metodologías ágiles y diseñando arquitecturas de datos escalables.
      </p>
    </div>

  </div>
</ion-content>

<app-footer></app-footer>
