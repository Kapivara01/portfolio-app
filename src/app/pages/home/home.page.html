<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="primary" style="--min-height: 90px;">
    
    <ion-buttons slot="start" style="display: flex; align-items: center; gap: 10px; margin-left: 10px;">
      <ion-menu-button style="color: white;"></ion-menu-button>
      
      <div style="width: 70px; height: 70px; border-radius: 50%; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.3);">
        <img src="assets/images/civ-logo.png" alt="CIV" 
             style="height: 100%; width: auto; object-fit: contain;">
      </div>
      
      <ion-title style="font-weight: 700; font-size: 1.3rem; color: white; padding: 0; margin-left: 5px;">
        <ion-icon name="home" style="vertical-align: middle; margin-right: 5px;"></ion-icon>
        Inicio
      </ion-title>
    </ion-buttons>

    <ion-buttons slot="end" style="margin-right: 15px;">
      <div style="width: 65px; height: 65px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: white; border: 2px solid rgba(255,255,255,0.3);">
        <img src="assets/images/uneti-logo.jpg" alt="UNETI"
             style="height: 100%; width: 100%; object-fit: cover; mix-blend-mode: multiply;">
      </div>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div id="container" style="text-align: center; margin-top: 2.5rem;">
    
    <div class="profile-avatar-wrapper"
         style="width: 200px; height: 200px; border-radius: 50%; margin: 0 auto 1.5rem; border: 4px solid var(--ion-color-primary-tint); box-shadow: 0 8px 24px rgba(56, 128, 255, 0.3); overflow: hidden;">
      <img src="assets/images/profile.jpg" alt="Jorge Luis Linares"
           style="width: 120%; height: 120%; object-fit: cover;">
    </div>
    
    <h1 style="color: var(--ion-color-primary); font-weight: 800; margin-bottom: 5px;">Ing. Jorge Luis Linares</h1>
    <p style="font-size: 1.2rem; color: #666; margin-top: 0;">Telecomunicaciones e Informática</p>
    
    <div style="font-weight: 600; font-size: 1.1rem; border-top: 1px solid #eee; padding-top: 15px; width: 80%; margin: 15px auto;">
      <p>Bienvenidos a mi Portafolio Profesional</p>
    </div>

  </div>
</ion-content>

<app-footer></app-footer>
