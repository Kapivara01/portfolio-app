<ion-content [fullscreen]="true">
  <div id="container" style="text-align: center; padding: 1rem; display: flex; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box;">
    
    <div style="margin: 1.5rem auto;">
      <div style="width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--ion-color-primary); box-shadow: 0 8px 20px rgba(56, 128, 255, 0.2); overflow: hidden; margin: 0 auto;">
        <img src="assets/images/profile.jpg" alt="Jorge Luis Linares" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
    </div>
    
    <div style="width: 100%;">
      <h1 style="color: var(--ion-color-primary); font-weight: 800; font-size: 1.5rem; text-transform: uppercase; margin: 10px 0;">
        Ing. Jorge Luis Linares
      </h1>
      
      <p style="font-size: 0.9rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">
        Telecomunicaciones e Informática
      </p>
      
      <div style="border-top: 1px solid #ddd; width: 50%; margin: 15px auto;"></div>
      
      <p style="font-size: 1.1rem; color: #333; line-height: 1.4; font-weight: 500; max-width: 95%; margin: 0 auto; padding-bottom: 2rem;">
        Ingeniero con talento excepcional para el desarrollo moderno y la gestión técnica, 
        enfocado en optimizar infraestructuras y diseñar soluciones de datos escalables.
      </p>
    </div>

  </div>
</ion-content>

<app-footer></app-footer>
