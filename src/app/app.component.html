<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>Portfolio</ion-list-header>
          <ion-note>Bienvenido</ion-note>

          @for (p of appPages; track p; let i = $index) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>

        <!-- BLOQUE DE CONTACTO -->
        <div style="margin: 20px 16px 10px 16px; padding: 15px; border-radius: 10px; background-color: rgba(56, 128, 255, 0.05); border: 1px solid rgba(56, 128, 255, 0.2);">
          <ion-note style="font-weight: 800; color: #3880ff; text-transform: uppercase; font-size: 0.75rem; display: block; margin-bottom: 10px;">
            CONTACTO
          </ion-note>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <ion-icon name="call-outline" style="color: #3880ff; font-size: 18px;"></ion-icon>
              <span style="font-weight: 700; color: #222; font-size: 0.9rem;">+58 0414-4838711</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <ion-icon name="mail-outline" style="color: #3880ff; font-size: 18px;"></ion-icon>
              <span style="font-weight: 700; color: #222; font-size: 0.9rem;">jluis7616&#64;gmail.com</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <ion-icon name="location-outline" style="color: #3880ff; font-size: 18px;"></ion-icon>
              <span style="font-weight: 700; color: #222; font-size: 0.9rem;">Venezuela</span>
            </div>
          </div>
        </div>

        <!-- BLOQUE DE AGENDAR / CONSULTAR -->
        <div style="margin: 0 16px; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; background: white; border-radius: 8px; border: 1px solid rgba(56, 128, 255, 0.2);">
          <span style="font-weight: 700; color: #444; font-size: 0.85rem;">Agendar/Consultar</span>
          <ion-button id="open-calendar" fill="clear" style="--color: #3880ff; margin: 0;">
            <ion-icon slot="icon-only" name="calendar-number-outline" style="font-size: 24px;"></ion-icon>
          </ion-button>
        </div>

        <!-- BLOQUE DE REDES SOCIALES -->
        <div style="margin: 15px 16px 20px 16px; padding: 15px; background: #ffffff; border-radius: 10px; border: 1px solid rgba(56, 128, 255, 0.2); text-align: center;">
          <div style="font-size: 0.75rem; font-weight: 800; color: #3880ff; letter-spacing: 0.5px; margin-bottom: 12px; text-transform: uppercase;">Conectemos</div>
          <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <a href="https://wa.me/584144838711" target="_blank" style="color: #25d366; font-size: 22px;"><ion-icon name="logo-whatsapp"></ion-icon></a>
            <a href="https://t.me/Jorgell7616" target="_blank" style="color: #0088cc; font-size: 22px;"><ion-icon name="paper-plane-outline"></ion-icon></a>
            <a href="https://youtube.com/@jluis7616" target="_blank" style="color: #ff0000; font-size: 22px;"><ion-icon name="logo-youtube"></ion-icon></a>
            <a href="https://github.com/Kapivara01" target="_blank" style="color: #0f172a; font-size: 22px;"><ion-icon name="logo-github"></ion-icon></a>
          </div>
        </div>
      </ion-content>
    </ion-menu>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="main-content" style="display: flex; flex-direction: column; height: 100vh;">
      <ion-router-outlet style="flex: 1;"></ion-router-outlet>
    </div>
  </ion-split-pane>
</ion-app>
