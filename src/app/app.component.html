<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header style="font-weight: 800; color: var(--ion-color-primary);">Portfolio</ion-list-header>
          <ion-note>Bienvenido</ion-note>
          
          @for (p of appPages; track p; let i = $index) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
        
        <div style="margin: 20px 16px; padding: 15px; border-radius: 12px; background-color: white; border: 1px solid rgba(56, 128, 255, 0.2); box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
          <ion-note style="font-weight: 800; color: #3880ff; text-transform: uppercase; font-size: 0.75rem; display: block; margin-bottom: 12px;">CONTACTO</ion-note>
          
          <div style="display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <ion-icon name="call-outline" style="color: #3880ff; font-size: 18px;"></ion-icon>
              <span style="font-weight: 700; color: #222; font-size: 0.9rem;">+58 0414-4838711</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <ion-icon name="mail-outline" style="color: #3880ff; font-size: 18px;"></ion-icon>
              <span style="font-weight: 700; color: #222; font-size: 0.9rem;">jluis7616&#64;gmail.com</span>
            </div>
          </div>

          <div style="text-align: center;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 10px;">
              <ion-icon name="calendar-clear-outline" style="color: #3880ff;"></ion-icon>
              <span style="font-size: 10px; font-weight: 800; text-transform: uppercase; color: #666;">{{ fechaActual }}</span>
            </div>
            
            <div style="display: flex; justify-content: center; margin-bottom: 10px;">
              <ion-datetime-button datetime="datetime"></ion-datetime-button>
            </div>

            <ion-modal [keepContentsMounted]="true">
              <ng-template>
                <ion-datetime id="datetime" presentation="date" locale="es-VE" [showDefaultButtons]="true" doneText="Agendar" cancelText="Cerrar"></ion-datetime>
              </ng-template>
            </ion-modal>

            <div style="font-size: 18px; font-weight: 900; color: #1a1a1a; padding-top: 8px; border-top: 1px dotted #ccc; font-family: monospace;">
              {{ horaActual }}
            </div>
          </div>
        </div>
      </ion-content>
    </ion-menu>

    <div class="ion-page" id="main-content">
      <ion-header class="ion-no-border">
        <ion-toolbar color="primary" style="--min-height: 80px; padding: 0 10px;">
          <ion-buttons slot="start">
            <ion-menu-button style="color: white;"></ion-menu-button>
            <div style="width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center; margin-left: 5px;">
              <img src="assets/images/civ-logo.png" alt="CIV" style="height: 80%; width: auto; object-fit: contain;">
            </div>
          </ion-buttons>

          <ion-title style="font-weight: 800; font-size: clamp(1rem, 4vw, 1.5rem); color: white; text-align: center; text-transform: uppercase; letter-spacing: 1px; padding: 0 5px;">
            Bienvenidos a mi Portafolio Profesional
          </ion-title>

          <ion-buttons slot="end">
            <div style="width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center; margin-right: 5px;">
              <img src="assets/images/uneti-logo.jpg" alt="UNETI" style="height: 100%; width: 100%; object-fit: cover; mix-blend-mode: multiply;">
            </div>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-router-outlet></ion-router-outlet>
    </div>
  </ion-split-pane>
</ion-app>
