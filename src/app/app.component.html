<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>Portfolio</ion-list-header>
          <ion-note>Bienvenido</ion-note>
          
          @for (p of appPages; track p; let i = $index) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
        
        <div style="margin: 20px 16px; padding: 15px; border-radius: 10px; background-color: rgba(56, 128, 255, 0.05); border: 1px solid rgba(56, 128, 255, 0.2);">
          <ion-note style="font-weight: 800; color: #3880ff; text-transform: uppercase; font-size: 0.75rem; display: block; margin-bottom: 10px;">CONTACTO</ion-note>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <ion-icon name="call-outline" style="color: #3880ff; font-size: 18px;"></ion-icon>
              <span style="font-weight: 700; color: #222; font-size: 0.9rem;">+58 0414-4838711</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <ion-icon name="mail-outline" style="color: #3880ff; font-size: 18px;"></ion-icon>
              <span style="font-weight: 700; color: #222; font-size: 0.9rem;">jluis7616&#64;gmail.com</span>
            </div>
          </div>
        </div>
      </ion-content>
    </ion-menu>

    <div class="ion-page" id="main-content">
      <ion-header class="ion-no-border">
        <ion-toolbar color="primary" style="--min-height: 85px;">
          <ion-buttons slot="start" style="margin-left: 10px;">
            <ion-menu-button style="color: white;"></ion-menu-button>
            <div style="width: 55px; height: 55px; border-radius: 50%; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center;">
              <img src="assets/images/civ-logo.png" alt="CIV" style="height: 80%; width: auto; object-fit: contain;">
            </div>
          </ion-buttons>

          <ion-title style="font-weight: 800; font-size: 1.5rem; color: white; text-align: center; text-transform: uppercase; letter-spacing: 2px;">
            Bienvenidos a mi Portafolio Profesional
          </ion-title>

          <ion-buttons slot="end" style="margin-right: 15px;">
            <div style="width: 55px; height: 55px; border-radius: 50%; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center;">
              <img src="assets/images/uneti-logo.jpg" alt="UNETI" style="height: 100%; width: 100%; object-fit: cover; mix-blend-mode: multiply;">
            </div>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-router-outlet></ion-router-outlet>
    </div>
  </ion-split-pane>
</ion-app>
